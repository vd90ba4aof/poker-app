; ============================================================================
; 青云扑克 ESP32-S3 - PlatformIO 配置 v3.1.0 (USB直连·双接口)
; ============================================================================
; v3.1.0：HID触摸屏接口(if0,class=3) + Vendor专用接口(if1,class=0xFF)
;   - 触摸输入走HID（系统usbhid占用无妨，App不claim）
;   - 命令/ACK走Vendor接口 EP0控制传输（0x41/0xC1），内核vendor类型豁免claim
;   - 需 CONFIG_TINYUSB_VENDOR_ENABLED=1（映射 CFG_TUD_VENDOR，见 arduino
;     tusb_config.h: CFG_TUD_VENDOR = CONFIG_TINYUSB_VENDOR_ENABLED）
; v3.0.0：从WiFi TCP迁移到USB直连（HID Feature Report，已证伪：class+iface
;   定向控制传输被内核强制check claim，usbhid占用HID接口导致-EBUSY）

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DCONFIG_TINYUSB_VENDOR_ENABLED=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main_usb.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
