; ============================================================================
; 青云扑克 ESP32-S3-CAM - PlatformIO 配置 v1.0.20
; ============================================================================
; v1.0.20：WiFi 日志功能（单线OTG方案）
;   - 日志缓冲区 + /logs HTTP端点，手机浏览器查看完整日志
;   - 不再需要串口线，只需OTG线连接OTG口
; v1.0.19：修复编译错误（移除不兼容的USB.onEvent和PHY寄存器）
; v1.0.18：全链路 USB debug 诊断（编译失败）
; v1.0.16：按Freenove官方文档修正USB-OTG配置(MODE=0, CDC=0)

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
