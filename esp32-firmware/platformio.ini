; ============================================================================
; 青云扑克 ESP32-S3 - PlatformIO 配置 v3.0.0 (USB直连)
; ============================================================================
; v3.0.0：从WiFi TCP迁移到USB直连（HID Feature Report）
;   - 编译源从main_tcp.cpp改为main_usb.cpp
;   - 删除WiFi依赖，纯USB HID单接口
;   - Report ID 1=触摸输入, Report ID 2=Feature命令通道
;   - 不新增接口/端点，对外只表现为普通USB触摸屏

[env:esp32s3-n16r8]
platform = espressif32@6.2.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DBROWNOUT_DET_LVL=0
	-DCONFIG_TINYUSB_HID_ENABLED=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Os
build_src_filter =
	+<main_usb.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
monitor_filters = direct
upload_protocol = esptool
upload_speed = 921600
