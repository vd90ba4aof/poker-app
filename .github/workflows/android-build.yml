name: Android Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: JS engine runtime smoke test
      run: node tests/engine_smoke.test.js
    - name: 手牌锁跨手回归(v604 P0门禁)
      run: node tests/engine_lock_regression.test.js
    - name: 河牌听牌误判门禁(v694 P10)
      run: node tests/engine_p10_river_draw.test.js

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK with version
      run: |
        GRADLE_VER=$(grep "versionName" app/build.gradle | head -1 | sed 's/.*versionName *"//;s/".*//')
        ENGINE_VER=$(grep -o "ENGINE_VERSION='[^']*'" app/src/main/assets/poker_helper.html | head -1 | sed "s/ENGINE_VERSION='//;s/'$//")
        echo "build.gradle versionName = $GRADLE_VER"
        echo "poker_helper.html ENGINE_VERSION = $ENGINE_VER"
        if [ "$GRADLE_VER" != "$ENGINE_VER" ]; then
          echo "::error::版本号漂移: build.gradle=$GRADLE_VER vs poker_helper.html=$ENGINE_VER — 两处版本源必须同步后重推"
          exit 1
        fi
        VERSION=$ENGINE_VER
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        cp app/build/outputs/apk/debug/app-debug.apk "poker-app-v${VERSION}.apk"
        echo "APK_NAME=poker-app-v${VERSION}.apk" >> $GITHUB_ENV
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poker-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Publish to Release (tag only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_NAME }}
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Publish CI Pre-release (main branch push)
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ci-v${{ env.VERSION }}-${{ env.SHORT_SHA }}
        name: "CI Build v${{ env.VERSION }} (${{ env.SHORT_SHA }})"
        files: ${{ env.APK_NAME }}
        draft: false
        prerelease: true
        generate_release_notes: true
