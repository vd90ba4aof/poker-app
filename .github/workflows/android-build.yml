name: Android Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    - name: Rename APK with version
      run: |
        VERSION=$(grep "versionName" app/build.gradle | head -1 | sed 's/.*"//;s/".*//')
        cp app/build/outputs/apk/debug/app-debug.apk "poker-app-v${VERSION}.apk"
        echo "APK_NAME=poker-app-v${VERSION}.apk" >> $GITHUB_ENV
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poker-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Publish to Release (tag only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_NAME }}
        draft: false
        prerelease: false
        generate_release_notes: true
