name: Android Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====== Job 1: 调试构建(仅 main 分支) ======
  # 仅 smoke test + assembleDebug,不签名不入库
  debug-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: JS engine runtime smoke test
      run: node tests/engine_smoke.test.js
    - name: 手牌锁跨手回归(v604 P0门禁)
      run: node tests/engine_lock_regression.test.js
    - name: 河牌听牌误判门禁(v694 P10)
      run: node tests/engine_p10_river_draw.test.js

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: 版本号一致性门禁
      run: |
        GRADLE_VER=$(grep "versionName" app/build.gradle | head -1 | sed 's/.*versionName *"//;s/".*//')
        ENGINE_VER=$(grep -o "ENGINE_VERSION='[^']*'" app/src/main/assets/poker_helper.html | head -1 | sed "s/ENGINE_VERSION='//;s/'$//")
        echo "build.gradle versionName = $GRADLE_VER"
        echo "poker_helper.html ENGINE_VERSION = $ENGINE_VER"
        if [ "$GRADLE_VER" != "$ENGINE_VER" ]; then
          echo "::error::版本号漂移: build.gradle=$GRADLE_VER vs poker_helper.html=$ENGINE_VER"
          exit 1
        fi

    - name: 上传debug产物
      uses: actions/upload-artifact@v4
      with:
        name: poker-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

  # ====== Job 2: 发布构建(仅 v* tag 触发) ======
  # 完整重编译 + R8 + 真签名 + 推 releases/
  # 关键修复: 此前所有 "重打包" 都只更新 html/manifest, dex 来自 V2.9.572 旧 APK
  # 本 job 通过 ./gradlew assembleRelease 从源码全量重编, dex 含 V2.9.573+ 全部 Kotlin 修改
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code (不含 keystore)
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ----- 预检查: keystore 必须存在(仓库内置,方案 B) -----
    #  注: keystore 通过 git add -f 入库, .gitignore 已通过 `*.keystore` + `!*.keystore.example` 规则
    #  仅 release 用的真 keystore 被强 commit,不会被普通 git add 自动跟踪
    - name: 校验 keystore 存在
      run: |
        if [ ! -f "poker-app-release.keystore" ]; then
          echo "::error::poker-app-release.keystore 不存在。"
          echo "提示: 本 job 依赖仓库内置 keystore (方案 B)。"
          echo "  如该 keystore 被 .gitignore 排除,请: git add -f poker-app-release.keystore && git push"
          echo "  或切换到方案 A (GitHub Secret 注入),见 README/CI 文档。"
          exit 1
        fi
        KS_SIZE=$(stat -c%s "poker-app-release.keystore")
        echo "✓ keystore 存在 (${KS_SIZE} 字节)"

    # ----- 预检查: 版本号一致性 -----
    - name: 版本号一致性门禁
      run: |
        GRADLE_VER=$(grep "versionName" app/build.gradle | head -1 | sed 's/.*versionName *"//;s/".*//')
        ENGINE_VER=$(grep -o "ENGINE_VERSION='[^']*'" app/src/main/assets/poker_helper.html | head -1 | sed "s/ENGINE_VERSION='//;s/'$//")
        echo "build.gradle versionName = $GRADLE_VER"
        echo "poker_helper.html ENGINE_VERSION = $ENGINE_VER"
        if [ "$GRADLE_VER" != "$ENGINE_VER" ]; then
          echo "::error::版本号漂移: build.gradle=$GRADLE_VER vs poker_helper.html=$ENGINE_VER"
          exit 1
        fi
        echo "VERSION=${ENGINE_VER}" >> $GITHUB_ENV

    # ----- JS 引擎单测 -----
    - name: JS engine runtime smoke test
      run: node tests/engine_smoke.test.js
    - name: 手牌锁跨手回归(v604 P0门禁)
      run: node tests/engine_lock_regression.test.js
    - name: 河牌听牌误判门禁(v694 P10)
      run: node tests/engine_p10_river_draw.test.js

    # ----- 完整重编译(R8 优化 + 真签名) -----
    - name: 完整重编译 assembleRelease
      run: ./gradlew assembleRelease --no-daemon
      # keystore 凭据已在恢复步骤注入到 $GITHUB_ENV,gradle 通过 System.getenv 读取

    # ----- 校验 APK 完整性 -----
    - name: 校验 release APK
      run: |
        APK="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK" ]; then
          echo "::error::release APK 未生成"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "(目录不存在)"
          exit 1
        fi
        APK_SIZE=$(stat -c%s "$APK")
        echo "release APK 大小: ${APK_SIZE} 字节"
        if [ "$APK_SIZE" -lt 1000000 ]; then
          echo "::error::APK 异常(<1MB)"
          exit 1
        fi
        # 校验签名
        if unzip -p "$APK" META-INF/MANIFEST.MF > /dev/null 2>&1; then
          echo "✓ APK 含 META-INF/MANIFEST.MF(已签名)"
        else
          echo "::error::APK 未签名"
          exit 1
        fi
        # 计算 SHA256
        SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
        echo "✓ SHA256: ${SHA256}"
        echo "APK_SHA256=${SHA256}" >> $GITHUB_ENV

    # ----- 重命名并准备发布物 -----
    - name: 重命名
      run: |
        APK="app/build/outputs/apk/release/app-release.apk"
        VERSION=${{ env.VERSION }}
        RELEASE_APK="poker-app-v${VERSION}-release.apk"
        cp "$APK" "$RELEASE_APK"
        echo "RELEASE_APK=${RELEASE_APK}" >> $GITHUB_ENV
        echo "✓ 已生成: ${RELEASE_APK}"

    # ----- 推送到 releases/(git add -f 绕过 .gitignore) -----
    # 注: 推送到远端 branch ref, 而不是 tag ref (annotated tag 不能被非快进更新)
    - name: 推送到 releases/
      run: |
        VERSION=${{ env.VERSION }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        OLD=$(ls releases/poker-app-v${VERSION}-release.apk 2>/dev/null || true)
        if [ -n "$OLD" ]; then
          git rm -f "releases/poker-app-v${VERSION}-release.apk"
          echo "✓ 已移除旧 $OLD"
        fi
        git add -f "poker-app-v${VERSION}-release.apk"
        git status --short
        # commit message 用文件避免 YAML 多行解析问题
        printf 'release: V%s APK (CI assembleRelease + 完整签名)\n\nSHA256: %s\nGitHub Actions: %s\n' \
          "${VERSION}" "${{ env.APK_SHA256 }}" "${{ github.run_id }}" > /tmp/commit_msg.txt
        git commit -F /tmp/commit_msg.txt || echo "无变更"
        # 主推送: 推到 main 分支(annotated tag 不能 fast-forward 推送)
        # 若 tag 与 main 同步(常见情况),此 push 会快速前进 main 一个提交
        PUSH_OK=0
        if git push origin HEAD:main 2>&1 | tee /tmp/push_main.log; then
          PUSH_OK=1
          echo "✓ 已推送到远端 main"
        else
          echo "::warning::推送 main 失败,尝试推送到独立 release branch"
          if git push origin HEAD:releases/v${VERSION} 2>&1 | tee /tmp/push_rel.log; then
            PUSH_OK=1
            echo "✓ 已推送到远端 releases/v${VERSION}"
          else
            echo "::warning::推送 release branch 也失败 — Release 上传仍由 action-gh-release 完成"
          fi
        fi
        if [ "$PUSH_OK" -eq 0 ]; then
          echo "::warning::git push 失败,但 APK 将通过 action-gh-release 上传作为 release asset"
        fi

    # ----- 上传为 artifact(备份) -----
    - name: 上传 artifact
      uses: actions/upload-artifact@v4
      with:
        name: poker-app-release
        path: ${{ env.RELEASE_APK }}
        retention-days: 90

    # ----- 创建 GitHub Release(带说明页) -----
    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "V${{ env.VERSION }}"
        body: |
          ## V${{ env.VERSION }} 完整签名发布版

          **✅ 本次 CI 关键改进**: 完整重编译 Kotlin 代码,解决此前 APK 内 dex 来自 V2.9.572 旧版的问题
          - `./gradlew assembleRelease` 全量构建
          - R8 优化已启用
          - dex 含 V2.9.573+ 全部 Kotlin 修改(包括 `sizeLocked` 等执行层修复)

          ### 安装信息
          - **包名**: `win.opt.view`
          - **versionName**: `${{ env.VERSION }}`
          - **SHA256**: `${{ env.APK_SHA256 }}`
          - **最低 Android**: 8.0 (API 26)
          - **目标 Android**: 14 (API 34)

          ### 国内直链下载
          ```
          https://gh-proxy.com/https://raw.githubusercontent.com/vd90ba4aof/poker-app/main/releases/poker-app-v${{ env.VERSION }}-release.apk
          ```
        files: ${{ env.RELEASE_APK }}
        draft: false
        prerelease: false
        generate_release_notes: true